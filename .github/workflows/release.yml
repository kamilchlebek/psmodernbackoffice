name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches module version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep -oP "\\\$this->version = '\K[^']+" psmodernbackoffice.php)
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match module version $VERSION in psmodernbackoffice.php"
            exit 1
          fi

      # PrestaShop expects the zip to contain a single top-level folder named after the module
      - name: Build zip
        run: git archive --format=zip --prefix=psmodernbackoffice/ -o psmodernbackoffice.zip HEAD

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" psmodernbackoffice.zip \
            --title "Modern Back Office $GITHUB_REF_NAME" \
            --generate-notes
